services:
  db:
    image: mysql:8.0
    container_name: phuzz-db
    command: >
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --log-raw
      --skip-name-resolve
      --innodb-doublewrite=0
      --innodb-flush-log-at-trx-commit=0
      --sync-binlog=0
      --log-bin=mysql-bin
      --binlog-format=ROW
      --server-id=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "3306:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./mysql-log:/var/log/mysql
      - ./db/install_schema.sql:/docker-entrypoint-initdb.d/install_schema.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/db_healthy || (mysqladmin ping -h localhost -uroot -prootpassword --silent && touch /tmp/db_healthy)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: .
    container_name: phuzz-php
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: phuzz-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      web:
        condition: service_started
    restart: always